<!DOCTYPE html>
<html>
<head>
    <title>Test Campaign Create</title>
</head>
<body>
    <h1>Test Campaign Create API</h1>
    <form id="campaignForm">
        <div>
            <label>Title:</label>
            <input type="text" id="title" value="Test Campaign" required>
        </div>
        <div>
            <label>Description:</label>
            <textarea id="description" required>Test Description</textarea>
        </div>
        <div>
            <label>Target Amount:</label>
            <input type="number" id="targetAmount" value="10000" required>
        </div>
        <div>
            <label>Category:</label>
            <select id="category">
                <option value="health">Health</option>
                <option value="education">Education</option>
                <option value="disaster">Disaster Relief</option>
            </select>
        </div>
        <div>
            <label>Location:</label>
            <input type="text" id="location" value="Dhaka">
        </div>
        <div>
            <label>Start Date:</label>
            <input type="date" id="startDate" value="2025-09-30">
        </div>
        <div>
            <label>End Date:</label>
            <input type="date" id="endDate" value="2025-12-30">
        </div>
        <div>
            <label>Urgent:</label>
            <input type="checkbox" id="isUrgent">
        </div>
        <div>
            <label>Featured:</label>
            <input type="checkbox" id="isFeatured">
        </div>
        <div>
            <label>Image:</label>
            <input type="file" id="image" accept="image/*">
        </div>
        <div>
            <label>Admin Token:</label>
            <input type="text" id="token" placeholder="Paste admin JWT token here" style="width: 400px;">
        </div>
        <button type="submit">Create Campaign</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('campaignForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('targetAmount', document.getElementById('targetAmount').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('startDate', document.getElementById('startDate').value);
            formData.append('endDate', document.getElementById('endDate').value);
            formData.append('isUrgent', document.getElementById('isUrgent').checked);
            formData.append('isFeatured', document.getElementById('isFeatured').checked);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }
            
            const token = document.getElementById('token').value;
            
            try {
                console.log('Sending request...');
                const response = await fetch('http://localhost:5000/api/campaign/admin/create', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                    },
                    body: formData
                });
                
                console.log('Response status:', response.status);
                const result = await response.json();
                console.log('Response:', result);
                
                document.getElementById('result').innerHTML = `
                    <h3>Response:</h3>
                    <p>Status: ${response.status}</p>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
                if (response.ok) {
                    alert('Campaign created successfully!');
                } else {
                    alert('Failed: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
