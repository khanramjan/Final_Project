<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Campaigns Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 8px; margin: 5px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .success { color: green; }
        .error { color: red; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Campaigns Debug Tool</h1>
        
        <div class="form-group">
            <h3>Step 1: Login as Admin</h3>
            <button onclick="loginAsAdmin()">Login as Admin</button>
            <div id="loginResult"></div>
        </div>

        <div class="form-group">
            <h3>Step 2: Test Campaign Fetch</h3>
            <button onclick="testCampaignFetch()" id="testBtn" disabled>Test Campaign Fetch</button>
            <div id="fetchResult"></div>
        </div>

        <div class="form-group">
            <h3>Console Logs</h3>
            <div id="logs" class="log"></div>
        </div>
    </div>

    <script>
        let authToken = null;

        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const logsDiv = document.getElementById('logs');

        function addToLogs(type, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg).join(' ');
            logsDiv.innerHTML += `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addToLogs('log', ...args);
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addToLogs('error', ...args);
        };

        async function loginAsAdmin() {
            const loginResult = document.getElementById('loginResult');
            const testBtn = document.getElementById('testBtn');
            
            try {
                console.log('🔄 Starting admin login...');
                
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@donationmanagement.com',
                        password: 'Admin@123!'
                    })
                });

                console.log('📡 Login response status:', response.status);

                if (!response.ok) {
                    throw new Error(`Login failed: ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Login successful:', data);

                authToken = data.token;
                localStorage.setItem('token', authToken);

                loginResult.innerHTML = `<div class="success">✅ Login successful! User: ${data.user.firstName} ${data.user.lastName} (${data.user.userType})</div>`;
                testBtn.disabled = false;

            } catch (error) {
                console.error('❌ Login error:', error);
                loginResult.innerHTML = `<div class="error">❌ Login failed: ${error.message}</div>`;
            }
        }

        async function testCampaignFetch() {
            const fetchResult = document.getElementById('fetchResult');
            
            try {
                console.log('🔄 Testing campaign fetch...');
                console.log('Auth token:', authToken ? 'Present' : 'Missing');

                // Test using the same API pattern as the frontend
                const headers = {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                };

                console.log('📡 Making request to /api/campaign/admin/all');

                const response = await fetch('http://localhost:5000/api/campaign/admin/all', {
                    method: 'GET',
                    headers: headers
                });

                console.log('📡 Campaign fetch response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Response error:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('✅ Campaign fetch successful:', data);

                fetchResult.innerHTML = `
                    <div class="success">
                        ✅ Campaign fetch successful!<br>
                        Total campaigns: ${data.totalCount}<br>
                        Campaigns returned: ${data.campaigns ? data.campaigns.length : 'N/A'}
                    </div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                console.error('❌ Campaign fetch error:', error);
                fetchResult.innerHTML = `<div class="error">❌ Campaign fetch failed: ${error.message}</div>`;
            }
        }

        // Auto-start
        console.log('🚀 Debug tool loaded. Ready to test admin campaigns.');
    </script>
</body>
</html>
